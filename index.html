<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق إدارة المهام</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input { padding: 8px; width: 70%; }
        button { padding: 8px 15px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>قائمة المهام (Task Tracker)</h2>
    
    <div>
        <input type="text" id="taskInput" placeholder="أدخل مهمة جديدة...">
        <button onclick="addTask()">إضافة</button>
    </div>

    <ul id="taskList"></ul>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api/tasks';

        // 1. جلب المهام من الـ Backend (GET Request)
        async function fetchTasks() {
            const response = await fetch(API_URL);
            const tasks = await response.json();
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.textContent = task.title;
                list.appendChild(li);
            });
        }

        // 2. إرسال مهمة جديدة للـ Backend (POST Request)
        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });

            input.value = '';
            fetchTasks(); // إعادة تحميل القائمة
        }

        // تشغيل جلب المهام عند فتح الصفحة
        fetchTasks();
    </script>
</body>
</html>
